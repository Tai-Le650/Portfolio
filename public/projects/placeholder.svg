<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.15" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="#0f172a"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#g)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#cbd5e1" text-anchor="middle">
    <text x="400" y="220" font-size="36" font-weight="600">Project screenshot</text>
    <text x="400" y="260" font-size="16" opacity="0.6">drop your image into /public/projects/</text>
  </g>
</svg>
